[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapeadlibrary-mcp"
version = "0.1.0"
description = "MCP server for the ScrapeAdLibrary API: search the Meta Ad Library from AI assistants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ScrapeAdLibrary" }]
keywords = ["mcp", "ad library", "ads", "competitor research", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.2,<2",  # 2.x renamed FastMCP: the server does not start on it
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://scrapeadlibrary.com"
Documentation = "https://scrapeadlibrary.com/docs/mcp"
Repository = "https://github.com/scrapeadlibrary/mcp-server"

[project.scripts]
scrapeadlibrary-mcp = "scrapeadlibrary_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapeadlibrary_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
